media:
  input: public
  output: /

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/blog
    view:
      fields: [title, author, draft, pubDatetime]
    fields:
      - name: author
        label: Author
        type: reference
        required: false
        options:
          collection: authors
          value: slug
          display: name
          search: [name, email]
      - name: pubDatetime
        label: Publish Date
        type: date
      - name: modDatetime
        label: Modified Date
        type: date
      - name: title
        label: Title
        type: string
        required: true
      - name: ogImage
        label: Open Graph Image URL
        type: string
      - name: slug
        label: Slug
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: 'Slug must contain only lowercase letters, numbers, and hyphens'
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: tags
        label: Tags
        type: string
        list: true
      - name: description
        label: Description
        type: string
      - name: body
        label: Body
        type: rich-text
  - name: authors
    path: src/content/authors
    type: collection
    label: Authors
    fields: # Add the fields section for authors
      - name:  slug
        label: Author Name
        type: string
        required: true
      - name: email # You might want to add other author-related fields here
        label: Email
        type: string
      - name: slug # THIS IS THE CRUCIAL ADDITION
        label: Slug
        type: string
        required: true
        pattern:
          regex: '^[a-z0-9-]+$'
          message: 'Slug must contain only lowercase letters, numbers, and hyphens'
    
